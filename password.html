
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Secret PIN ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ffd6e7, #f7a9c4, #ffe4ed);
}

.container {
    width: 90%;
    max-width: 360px;
    padding: 30px 25px;
    text-align: center;
    background: rgba(255,255,255,0.9);
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(160,50,90,0.2);
}

.heart {
    font-size: 48px;
    animation: beat 1.3s infinite;
}

h2 {
    color: #c12c65;
    margin-bottom: 8px;
}

p {
    color: #815066;
    font-size: 14px;
}

.pin-boxes {
    display: flex;
    justify-content: center;
    gap: 13px;
    margin: 25px 0;
}

.pin {
    width: 48px;
    height: 55px;
    border: 2px solid #e99bb8;
    border-radius: 12px;
    font-size: 26px;
    font-weight: bold;
    color: #c12c65;
    display: flex;
    justify-content: center;
    align-items: center;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 260px;
    margin: auto;
}

.key {
    height: 55px;
    border: none;
    border-radius: 15px;
    background: #ffe0eb;
    color: #b52b60;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(150,50,90,0.12);
}

.key:active {
    transform: scale(0.94);
    background: #f7b5cd;
}

.unlock {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #d63378;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

#error {
    color: #d00045;
    min-height: 20px;
    font-size: 13px;
    margin-top: 12px;
}

@keyframes beat {
    50% { transform: scale(1.18); }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart">💗</div>

    <h2>something special</h2>

    <p>Enter our special 4-digit PIN, Baby 🔐<br><br>
        *its our dates*

    </p>

    <div class="pin-boxes">
        <div class="pin" id="pin0"></div>
        <div class="pin" id="pin1"></div>
        <div class="pin" id="pin2"></div>
        <div class="pin" id="pin3"></div>
    </div>

    <div class="keypad">
        <button class="key" onclick="addNumber('1')">1</button>
        <button class="key" onclick="addNumber('2')">2</button>
        <button class="key" onclick="addNumber('3')">3</button>
        <button class="key" onclick="addNumber('4')">4</button>
        <button class="key" onclick="addNumber('5')">5</button>
        <button class="key" onclick="addNumber('6')">6</button>
        <button class="key" onclick="addNumber('7')">7</button>
        <button class="key" onclick="addNumber('8')">8</button>
        <button class="key" onclick="addNumber('9')">9</button>
        <button class="key" onclick="clearPIN()">C</button>
        <button class="key" onclick="addNumber('0')">0</button>
        <button class="key" onclick="deleteNumber()">⌫</button>
    </div>

    <button class="unlock" onclick="checkPIN()">
        Unlock Your Surprise my Love ❤️
    </button>

    <div id="error"></div>

</div>

<script>
let enteredPIN = "";

function updatePIN() {
    for (let i = 0; i < 4; i++) {
        document.getElementById("pin" + i).textContent =
            enteredPIN[i] ? "●" : "";
    }
}

function addNumber(number) {
    if (enteredPIN.length < 4) {
        enteredPIN += number;
        updatePIN();
        document.getElementById("error").textContent = "";
    }
}

function deleteNumber() {
    enteredPIN = enteredPIN.slice(0, -1);
    updatePIN();
}

function clearPIN() {
    enteredPIN = "";
    updatePIN();
    document.getElementById("error").textContent = "";
}

function checkPIN() {
    if (enteredPIN === "2023") {
       window.location.href = "welcome.html";
    } else {
        document.getElementById("error").textContent =
            "Wrong PIN! Try again, Baby ❤️";
        enteredPIN = "";
        updatePIN();
    }
}
</script>

</body>
</html>
