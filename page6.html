<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Catch the Hearts</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f5, #fff5ee, #fce4ec);
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      overflow: hidden;
      touch-action: manipulation;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      padding: 25px 20px 30px;
      box-shadow: 0 20px 50px rgba(200, 120, 150, 0.18);
      text-align: center;
      position: relative;
    }

    .small-title {
      font-size: 13px;
      color: #c45c7a;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    h2 {
      font-size: 24px;
      color: #b33b5c;
      margin-bottom: 6px;
    }

    .score {
      font-size: 17px;
      color: #d987a1;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .game-area {
      width: 100%;
      height: 340px;
      background: #fff5f7;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 36px;
      cursor: pointer;
      user-select: none;
      z-index: 20;
      animation: fall linear forwards;
      touch-action: manipulation;
    }

    @keyframes fall {
      to {
        transform: translateY(380px) rotate(360deg);
      }
    }

    .corner-btn {
      position: fixed;
      bottom: 25px;
      padding: 12px 22px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 15px;
      font-family: Georgia, serif;
      box-shadow: 0 6px 18px rgba(180, 100, 130, 0.25);
      z-index: 999;
    }
    .back-btn {
      left: 18px;
      background: #ffe4ec;
      color: #b33b5c;
    }
    .next-btn {
      right: 18px;
      background: #d987a1;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="small-title">FUN TIME</p>
    <h2>Catch the Hearts</h2>
    <p class="score">Hearts Caught: <span id="score">0</span> / 10</p>

    <div class="game-area" id="gameArea"></div>
  </div>

  <a href="page5.html" class="corner-btn back-btn">← Back</a>
  <a href="page7.html" class="corner-btn next-btn">Next 💕</a>

  <script>
    const gameArea = document.getElementById('gameArea');
    const scoreText = document.getElementById('score');
    let score = 0;
    let gameOver = false;

    function createHeart() {
      if (gameOver) return;

      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = ['💖', '💕', '💗', '❤️', '💓'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 75 + 8 + '%';
      heart.style.top = '-60px';
      heart.style.animationDuration = (3 + Math.random() * 2) + 's';

      // This function runs when heart is tapped
      function catchHeart(e) {
        e.preventDefault();
        e.stopPropagation();

        if (gameOver) return;

        heart.remove();
        score++;
        scoreText.innerText = score;

        if (score >= 10) {
          gameOver = true;
          // Automatically go to next page after 0.8 second
          setTimeout(() => {
            window.location.href = 'page7.html';
          }, 800);
        }
      }

      // Support both click and touch
      heart.addEventListener('click', catchHeart);
      heart.addEventListener('touchstart', catchHeart);

      gameArea.appendChild(heart);

      // Remove heart if it falls without being caught
      setTimeout(() => {
        if (heart.parentElement) heart.remove();
      }, 6000);
    }

    // Create new hearts regularly
    setInterval(() => {
      if (!gameOver) createHeart();
    }, 700);

    // Start with some hearts
    createHeart();
    setTimeout(createHeart, 300);
    setTimeout(createHeart, 600);
  </script>

</body>
</html>
