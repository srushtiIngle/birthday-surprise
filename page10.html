
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffe4ef">
<title>Our Little World ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
}

body {
    background: linear-gradient(135deg, #ffe4ef, #ffc3d9, #fff0f6);
    color: #a43e6d;
}

#scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 500px;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #fff7fb, transparent 55%),
        linear-gradient(135deg, #ffe4ef, #ffc3d9, #fff0f6);
}

.scene-content {
    position: absolute;
    inset: 0;
    transition: filter 4s ease, opacity 4s ease, transform 4s ease;
}

/* HEADING */

.heading {
    position: absolute;
    top: 5%;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 0 12px;
    z-index: 20;
    animation: headingIn 1.5s ease both;
}

.heading h1 {
    font-size: clamp(28px, 7vw, 42px);
    color: #c34f82;
    text-shadow: 0 3px 12px white;
}

.heading p {
    margin-top: 8px;
    font-size: 15px;
    color: #a65b7b;
}

@keyframes headingIn {
    from {
        opacity: 0;
        transform: translateY(-25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MAIN PHOTO */

.main-photo {
    position: absolute;
    width: clamp(180px, 48vw, 290px);
    height: clamp(220px, 55vw, 340px);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.6);
    z-index: 5;
    opacity: 0;
    animation:
        mainAppear 1.5s cubic-bezier(.2,.8,.2,1) forwards,
        heartbeat 3s ease-in-out 1.5s infinite;
}

.main-frame {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 9px;
    background: rgba(255,255,255,.95);
    border: 2px solid white;
    border-radius: 16px;
    box-shadow:
        0 0 0 5px rgba(255,150,190,.25),
        0 15px 40px rgba(180,70,120,.3);
}

.main-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
}

.main-caption {
    position: absolute;
    bottom: -37px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #bd4778;
    font-size: 18px;
    text-shadow: 0 2px 8px white;
    white-space: nowrap;
}

@keyframes mainAppear {
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes heartbeat {
    0%, 100% { scale: 1; }
    50% { scale: 1.025; }
}

/* MEMORY PHOTOS */

.photo {
    position: absolute;
    width: clamp(95px, 25vw, 155px);
    height: clamp(120px, 31vw, 190px);
    padding: 6px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(160,65,110,.24);
    opacity: 0;
    z-index: 8;
    object-fit: cover;
    border: 1px solid #ffe1ec;
}

.photo.show {
    animation:
        photoEnter 1.2s cubic-bezier(.17,.67,.35,1.15) forwards,
        photoFloat 4s ease-in-out 1.2s infinite;
}

@keyframes photoEnter {
    0% {
        opacity: 0;
        transform: translate(var(--from-x), var(--from-y))
                   rotate(var(--start-rotate)) scale(.35);
    }
    70% {
        opacity: 1;
        transform: translate(0,0)
                   rotate(var(--end-rotate)) scale(1.06);
    }
    100% {
        opacity: 1;
        transform: translate(0,0)
                   rotate(var(--end-rotate)) scale(1);
    }
}

@keyframes photoFloat {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -7px; }
}

/* FLOATING HEARTS */

.heart {
    position: absolute;
    color: #e77ca5;
    pointer-events: none;
    opacity: .7;
    animation: heartFloat 7s linear infinite;
    z-index: 2;
}

@keyframes heartFloat {
    from {
        transform: translateY(110vh) rotate(0);
        opacity: 0;
    }
    15% { opacity: .8; }
    to {
        transform: translateY(-15vh) rotate(40deg);
        opacity: 0;
    }
}

/* SPARKLES */

.sparkle {
    position: absolute;
    color: white;
    font-size: 20px;
    text-shadow: 0 0 10px #ed7fa9;
    animation: sparkle 2s ease-in-out infinite alternate;
    z-index: 3;
}

@keyframes sparkle {
    from {
        opacity: .3;
        transform: scale(.7) rotate(0);
    }
    to {
        opacity: 1;
        transform: scale(1.4) rotate(30deg);
    }
}

/* ENDING MESSAGE */

.ending {
    position: absolute;
    bottom: 4%;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 0 15px;
    opacity: 0;
    z-index: 25;
    color: #b74779;
    font-size: clamp(15px, 3.5vw, 20px);
    line-height: 1.5;
    text-shadow: 0 2px 8px white;
}

.ending.visible {
    animation: headingIn 2s ease forwards;
}

/* MOBILE LAYOUT */

@media (max-width: 600px) {

    #scene {
        min-height: 600px;
    }

    .heading {
        top: 3.5%;
    }

    .heading h1 {
        font-size: clamp(26px, 7vw, 34px);
    }

    .heading p {
        font-size: 13px;
    }

    .main-photo {
        top: 28%;
        width: clamp(135px, 39vw, 175px);
        height: clamp(165px, 47vw, 215px);
    }

    .main-frame {
        padding: 7px;
        border-radius: 13px;
    }

    .main-caption {
        bottom: -29px;
        font-size: 14px;
    }

    /* All seven photos arranged in a neat grid */

    #gallery {
        position: absolute;
        left: 5%;
        width: 90%;
        top: 51%;
        height: 34%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 7px;
        align-items: center;
        justify-items: center;
        z-index: 8;
    }

    .photo {
        position: relative !important;
        left: auto !important;
        right: auto !important;
        top: auto !important;
        bottom: auto !important;
        width: min(100%, 105px);
        height: min(100%, 94px);
        min-width: 0;
        padding: 4px;
        border-radius: 8px;
        object-fit: cover;
    }

    .photo:nth-child(7) {
        grid-column: 2;
    }

    .ending {
        bottom: 2.5%;
        font-size: 15px;
        padding: 0 10px;
    }

    .ending br {
        line-height: 1.2;
    }

    .sparkle {
        font-size: 14px;
    }
}

/* SHORT PHONE SCREENS */

@media (max-width: 600px) and (max-height: 720px) {

    .heading {
        top: 2%;
    }

    .main-photo {
        top: 27%;
        width: 125px;
        height: 150px;
    }

    #gallery {
        top: 48%;
        height: 37%;
        gap: 4px;
    }

    .photo {
        height: min(100%, 78px);
    }

    .ending {
        font-size: 13px;
        bottom: 1%;
    }
}

/* FINAL BLUR AND CLOSING SCREEN */

#final-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;

    background: rgba(255, 222, 237, .40);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);

    opacity: 0;
    visibility: hidden;
    transition:
        opacity 4s ease,
        backdrop-filter 4s ease,
        visibility 4s;
}

#final-screen.active {
    opacity: 1;
    visibility: visible;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.final-message {
    max-width: 420px;
    padding: 35px 22px;
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 25px;
    background: rgba(255,255,255,.48);
    box-shadow: 0 10px 50px rgba(190,90,135,.12);
    transform: translateY(20px);
    opacity: 0;
    transition: all 3s ease 1s;
}

#final-screen.active .final-message {
    transform: translateY(0);
    opacity: 1;
}

.final-heart {
    font-size: 42px;
    display: block;
    margin-bottom: 18px;
    animation: finalPulse 2s ease-in-out infinite;
}

.final-message h2 {
    color: #bd4778;
    font-size: clamp(27px, 7vw, 38px);
    margin-bottom: 18px;
}

.final-message p {
    color: #a65b7b;
    font-size: 17px;
    line-height: 1.8;
}

.final-message .forever {
    margin-top: 22px;
    color: #c34f82;
    font-size: 20px;
}

@keyframes finalPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.13); }
}

/* STOP ALL MOVEMENT AT THE END */

#scene.finished .scene-content {
    filter: blur(15px);
    opacity: .45;
    transform: scale(1.025);
}

#scene.finished .heart,
#scene.finished .sparkle,
#scene.finished .photo,
#scene.finished .main-photo,
#scene.finished .heading {
    animation-play-state: paused !important;
}

#scene.finished .ending {
    animation-play-state: paused !important;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
    }
}

</style>
</head>

<body>

<div id="scene">

    <div class="scene-content">

        <div class="heading">
            <h1>My Whole World ❤️</h1>
            <p></p>
        </div>

        <!-- MAIN PHOTO -->

        <div class="main-photo">
            <div class="main-frame">
                <img
                    src="images/c5f21317-d4b0-40e4-acc5-f88ac8fcc95f.jpg"
                    alt="Our favourite memory">
            </div>
            <div class="main-caption">My favourite person ❤️</div>
        </div>

        <!-- MEMORY GALLERY -->

        <div id="gallery"></div>

        <!-- ENDING MESSAGE -->

        <div class="ending" id="ending">
            My favourite memory and many more yet to come. ❤️
            <br><br>
            I love you infinity, Baby! 💗
        </div>

    </div>

</div>

<!-- FINAL ROMANTIC SCREEN -->

<div id="final-screen">

    <div class="final-message">

        <span class="final-heart">❤️</span>

        <h2>My Whole World</h2>

        <p>
            If I could choose again,
            in every lifetime,
            I would still choose you.
        </p>

        <p class="forever">
            I love you infinity, Baby! 💗
        </p>

        <p style="margin-top:20px; font-size:14px;">
            Forever yours. ❤️
        </p>

    </div>

</div>

<script>

/* YOUR ORIGINAL PHOTOS */

const photos = [
    "./4e213f97-fa69-40aa-bd6c-6e2da9591e2f.jpg",
    "./8faaf054-906f-4ec4-bc99-ea59953a921e.jpg",
    "./935b0201-d63c-45e0-8395-337a36751b01.jpg",
    "./7a78b938-7dc4-46e3-9925-fb5832fcb19a.jpg",
    "./7b27e1e5-7295-4909-b9f8-a6056c0e1eda.jpg",
    "./af784d5f-3c87-4307-952a-bf98f9930afd.jpg",
    "./a3b49f48-7228-4e0a-9ebd-1e6c0f271f00.jpg"
];

/* DESKTOP PHOTO POSITIONS */

const positions = [
    { left: "3%", top: "23%" },
    { left: "4%", bottom: "19%" },
    { right: "4%", bottom: "19%" },
    { left: "29%", top: "19%" },
    { right: "29%", top: "19%" },
    { left: "28%", bottom: "14%" },
    { right: "28%", bottom: "14%" }
];

const gallery = document.getElementById("gallery");

const isMobile = window.matchMedia("(max-width: 600px)").matches;

/* SHUFFLE PHOTOS */

const shuffledPhotos = [...photos].sort(() => Math.random() - 0.5);

const shuffledPositions = [...positions].sort(
    () => Math.random() - 0.5
);

/* REVEAL PHOTOS */

shuffledPhotos.forEach((src, index) => {

    const img = document.createElement("img");

    img.src = src;
    img.alt = "Our memory";
    img.className = "photo";

    const directions = [
        ["-110vw", "-70vh"],
        ["110vw", "-60vh"],
        ["-100vw", "70vh"],
        ["100vw", "70vh"],
        ["0", "-110vh"],
        ["0", "110vh"],
        ["-110vw", "0"],
        ["110vw", "0"]
    ];

    const direction = directions[
        Math.floor(Math.random() * directions.length)
    ];

    img.style.setProperty("--from-x", direction[0]);
    img.style.setProperty("--from-y", direction[1]);

    const rotation = Math.random() * 12 - 6;

    img.style.setProperty(
        "--start-rotate",
        (rotation * 2) + "deg"
    );

    img.style.setProperty(
        "--end-rotate",
        rotation + "deg"
    );

    /* DESKTOP POSITIONS ONLY */

    if (!isMobile) {
        const pos = shuffledPositions[index];
        Object.assign(img.style, pos);
    }

    gallery.appendChild(img);

    /* Each photo appears one by one */

    setTimeout(() => {
        img.classList.add("show");
    }, 1500 + index * 850);

});

/* FLOATING HEARTS */

for (let i = 0; i < 18; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.textContent = Math.random() > .5 ? "♥" : "♡";

    heart.style.left = Math.random() * 100 + "%";

    heart.style.fontSize =
        (14 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (6 + Math.random() * 7) + "s";

    heart.style.animationDelay =
        Math.random() * 6 + "s";

    document.querySelector(".scene-content").appendChild(heart);
}

/* SPARKLES */

for (let i = 0; i < 12; i++) {

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";
    sparkle.textContent = "✦";

    sparkle.style.left = Math.random() * 100 + "%";
    sparkle.style.top = Math.random() * 100 + "%";

    sparkle.style.animationDelay =
        Math.random() * 2 + "s";

    document.querySelector(".scene-content").appendChild(sparkle);
}

/* SHOW ENDING MESSAGE */

const endingTime = 1500 + photos.length * 850 + 1200;

setTimeout(() => {

    document.getElementById("ending").classList.add("visible");

}, endingTime);


/* FINAL ENDING AFTER 25 SECONDS */

setTimeout(() => {

    document.getElementById("scene").classList.add("finished");
    document.getElementById("final-screen").classList.add("active");

    // Wait 12 seconds before returning
    setTimeout(() => {

        window.parent.postMessage(
            { type: "BIRTHDAY_END" },
            window.location.origin
        );

    }, 12000);

}, 25000);



</script>

</body>
</html>
